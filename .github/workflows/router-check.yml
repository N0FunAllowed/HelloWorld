name: Router checks

on:
  pull_request:
    paths:
      - "scripts/route_task.py"
      - "tests/test_route_task.py"
      - "config/router.json"
      - ".github/workflows/router-check.yml"
  push:
    branches: [master]
    paths:
      - "scripts/route_task.py"
      - "tests/test_route_task.py"
      - "config/router.json"
      - ".github/workflows/router-check.yml"

permissions:
  contents: read

jobs:
  router-check:
    uses: N0FunAllowed/AI-Dev-Workflows/.github/workflows/router-check.yml@v1
