name: Router checks

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/router-check.yml"
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/router-check.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  test-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
